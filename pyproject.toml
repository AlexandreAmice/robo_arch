[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "robo-arch"
version = "0.1.0"
description = "Reusable robotics autonomy declarations and implementations"
requires-python = ">=3.12"
dependencies = ["numpy>=2.3.1,<3", "pydantic==2.13.5", "PyYAML==6.0.3"]

[dependency-groups]
test = ["pytest==9.1.1"]
dev = [
  {include-group = "test"},
  "ruff==0.16.9",
  "clang-format==22.1.8",
]
drake = ["drake==1.57.0"]
docs = ["sphinx==8.2.3"]

[tool.uv]
required-version = "==0.12.20"
default-groups = ["dev", "drake"]

[tool.hatch.build.targets.wheel]
packages = ["src/robo_arch"]

[tool.ruff]
target-version = "py312"
line-length = 88
indent-width = 4
respect-gitignore = false
exclude = [".git", ".venv*", "bazel-*", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests", "src/robo_arch", "tools"]
norecursedirs = [".git", ".venv*", "bazel-*", "dist", "__pycache__"]
