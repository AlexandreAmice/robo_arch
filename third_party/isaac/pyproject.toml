[project]
name = "robo-arch-isaac"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
    "drake==1.57.0",
    "isaaclab==3.0.0rc1",
    "isaacsim-core==6.1.0.0",
    "isaacsim[compatibility-check]==6.1.0.0",
    "opencv-python-headless-noffmpeg==4.14.0.94rc1",
    "packaging==26.0",
    "pyyaml==6.0.3",
    "robo-arch",
]

[dependency-groups]
cbf-gpu = ["moreau[cuda13]==0.4.1", "torch==2.11.0", "jaxsim==0.8.2", "jax[cuda13]==0.11.2"]
test = ["pytest==9.1.1"]

[tool.uv]
package = false
# Isaac Lab 3.0 EA tested overrides; scoped to this vendor profile.
# https://github.com/isaac-sim/IsaacLab/blob/v3.0.0-EA/tools/wheel_builder/uv-overrides.txt
override-dependencies = [
    "numpy>=2",
    "mujoco~=3.11.0",
    "mujoco-warp~=3.11.0",
    "newton[sim]==1.5.2",
    "newton-usd-schemas>=0.4.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    "packaging>=20,<27",
]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[tool.uv.sources]
isaaclab = { index = "nvidia" }
opencv-python-headless-noffmpeg = { index = "nvidia" }
robo-arch = { path = "../../", editable = true }
